name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # Re-publishes the version in package.json, e.g. after a failed tag run.
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing to npm (no NPM_TOKEN)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish with provenance
        run: npm publish --provenance --access public --loglevel verbose
